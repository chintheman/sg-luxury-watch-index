# Separation-of-duties policy (spec §4 P4, enforced by G5).
#
# This file IS the P4 table. The guard hook reads it on every PreToolUse call
# and adjudicates by the calling agent's `agent_type`.
#
# Semantics:
#   write_allow  — glob patterns this agent may create/modify. Empty list means
#                  the agent may not write at all.
#   read_allow   — if present, the agent may read ONLY these. Allow-list beats
#                  deny-list here: a deny-list of directory names silently
#                  fails open in any repo that names things differently.
#   read_deny    — patterns this agent may NOT read, via ANY content-returning
#                  tool (Read, Grep, Glob, WebFetch).
#   url_deny     — substrings that, if present in a WebFetch URL, are blocked.
#   bash_deny    — regexes matched against the full Bash command.
#
# An agent_type absent from this file is DENIED any write. Fail closed.

defaults:
  # Snapshot laundering (P8/G4). Every pattern is anchored to a TEST RUNNER.
  #
  # A bare `-u` lived here originally and it was a disaster: it blocked
  # `git push -u`, `sort -u` and `pip install -U`, none of which have anything
  # to do with snapshots. A gate that fires on innocent commands trains people
  # to route around it, and a gate people route around is worse than no gate.
  bash_deny:
    - '\b(jest|vitest)\b[^|;]*\s(-u|--update|--updateSnapshot)(\s|$)'
    - '\bplaywright\b[^|;]*--update-snapshots'
    - '\bpytest\b[^|;]*--snapshot-update'
    - '\bcargo\s+insta\s+accept\b'
    - '\bava\b[^|;]*--update-snapshots'

  # Enforced on the tool's TARGET PATH, never by matching command text. Text
  # matching blocked reading, grepping and even *running* the gates.
  write_deny_always:
    - ".qa/policy.yaml"
    - ".claude/hooks/**"

  # Immutable to AGENTS, editable by the orchestrator. Redundant in practice —
  # agents are confined by write_allow and none of these appear there — but kept
  # explicit so the intent survives an edit to the allow-lists.
  agent_write_deny:
    - ".qa/gates/**"
    - ".qa/RISK-RULES.yaml"
    - ".claude/qa-settings/**"
    - ".github/workflows/**"

agents:

  risk-scout:
    write_allow: [".qa/risk/**"]

  spec-oracle:
    write_allow: [".qa/oracles/**"]
    # P2. The previous version denied src/, lib/ and app/ — none of which exist
    # here. The oracle could read index/, parser/ and scraper/ freely while the
    # Confidence Report still asserted blindness: a fail-open default, worse
    # than no defence because it is indistinguishable from a working one.
    #
    # Now an allow-list. ARCHITECTURE.md and METHODOLOGY.md remain readable on
    # purpose — they are this project's specification.
    read_allow:
      - "README*"
      - "docs/**"
      - "doc/**"
      - "**/*.md"
      - "openapi.*"
      - "swagger.*"
      - "**/*.graphql"
      - "**/schema.json"
      - ".qa/oracles/**"
      - ".qa/charters/**"
    read_deny:
      # By file extension, not directory name, so a new source folder cannot
      # quietly escape the rule.
      - "**/*.py"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.sql"
      - "**/*.diff"
      - "**/*.patch"
      - ".qa/risk/**"
    url_deny:
      - "/pull/"
      - "/commit/"
      - "/compare/"
      - ".diff"
      - ".patch"
      - "/blob/"
      - "/raw/"
    bash_deny:
      - '^\s*git\s+(diff|show|log|blame)'
      - '^\s*(cat|head|tail|sed|awk|less)\b'

  prober:
    write_allow: [".qa/sessions/**", ".qa/bugs/**", ".qa/charters/**", ".qa/artifacts/**"]

  authz-prober:
    write_allow: [".qa/authz-matrix.yaml", ".qa/bugs/**", ".qa/reports/authz-**"]

  unit-smith:
    write_allow: ["tests/**", "**/*.test.*", "**/*.spec.*",
                  ".qa/reports/unit-smith-**", ".qa/disputes/**"]

  flow-smith:
    write_allow: ["tests/**", "e2e/**", "**/*.spec.ts", ".qa/plans/**",
                  ".qa/reports/flow-smith-**", ".qa/artifacts/**"]

  # The load-bearing row: the agent that fixes code may not edit the test that
  # judges the fix.
  patch-smith:
    # This project has no src/. Without these entries patch-smith could write
    # nothing at all, and an agent that cannot do its job lobbies to have the
    # constraint removed — §7.1's predicted failure.
    write_allow: ["index/**", "parser/**", "scraper/**", "web/**",
                  "pipeline.py", "run_filter.py", "sold_tracer.py"]
    write_deny:
      - "tests/**"
      - "**/*.test.*"
      - "**/*.spec.*"
      - "**/conftest.py"
      - "migrations/**"        # applied migrations are not reversible by a deploy
      - ".qa/reports/**"
    # P7: no retrieving the answer.
    bash_deny:
      - '^\s*git\s+(log|show|blame|fetch|pull)'
      - '^\s*(curl|wget)\b'
    url_deny: ["github.com", "gitlab.com", "stackoverflow.com"]

  flake-warden:
    write_allow: [".qa/flakes.json", ".qa/reports/nightly-**", ".qa/quarantine.yaml"]

  release-marshal:
    write_allow: [".qa/reports/**", ".qa/metrics/verdicts/**"]
