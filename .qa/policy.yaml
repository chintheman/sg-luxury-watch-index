# Separation-of-duties policy (spec §4 P4, enforced by G5).
#
# This file IS the P4 table. `.claude/hooks/qa-guard.sh` reads it on every
# PreToolUse call and adjudicates by the calling agent's `agent_type`.
#
# Semantics:
#   write_allow  — glob patterns this agent may create/modify. Empty list means
#                  the agent may not write at all.
#   read_deny    — patterns this agent may NOT read, via ANY content-returning
#                  tool (Read, Grep, Glob, WebFetch). §7.2 exists because
#                  blocking Read alone is not enough.
#   url_deny     — substrings that, if present in a WebFetch URL, are blocked.
#   bash_deny    — regexes matched against the full Bash command.
#
# An agent_type absent from this file is DENIED any write. Fail closed: an
# unknown agent is an unreviewed agent.

defaults:
  # Applies to every agent, and to the orchestrator (main session).
  # G4: snapshot laundering. An agent that CAN run --update-snapshots WILL (P8).
  bash_deny:
    - '(^|\s)(-u|--update-snapshot|--updateSnapshot|--update-snapshots|-U)(\s|$)'
    - 'jest\s+.*(-u|--updateSnapshot)'
    - 'vitest\s+.*(-u|--update)'
    - 'playwright\s+.*--update-snapshots'
    - 'pytest\s+.*--snapshot-update'
    - 'cargo\s+insta\s+accept'
    # Nothing may rewrite the policy or the gates from inside a session.
    - '\.qa/(policy\.yaml|gates/|RISK-RULES\.yaml)'
  write_deny_always:
    - ".qa/policy.yaml"
    - ".qa/gates/**"
    - ".qa/RISK-RULES.yaml"
    - ".claude/hooks/**"
    - ".claude/qa-settings/**"
    - ".github/workflows/**"

agents:

  # --- Analysts: may write only their own .qa/ subdirectory -----------------
  risk-scout:
    write_allow: [".qa/risk/**"]

  spec-oracle:
    write_allow: [".qa/oracles/**"]
    # P2 is the whole reason this agent exists as a separate process. It must
    # never see the implementation, the diff, or even the changed-file LIST —
    # a file list is itself implementation information (§3.2).
    read_deny:
      - "src/**"
      - "lib/**"
      - "app/**"
      - "packages/*/src/**"
      - "tests/**"
      - "test/**"
      - "**/*.test.*"
      - "**/*.spec.*"
      - ".qa/risk/**"
      - "**/*.diff"
      - "**/*.patch"
    url_deny:
      - "/pull/"          # a PR URL returns the diff
      - "/commit/"
      - "/compare/"
      - ".diff"
      - ".patch"
      - "/blob/"
      - "/raw/"
    bash_deny:
      - '^\s*git\s+(diff|show|log|blame)'   # the diff by another route
      - '^\s*(cat|head|tail|sed|awk|less)\b'

  prober:
    # Writes findings only. Never tests, never source (§3.8).
    write_allow: [".qa/sessions/**", ".qa/bugs/**", ".qa/charters/**", ".qa/artifacts/**"]

  authz-prober:
    write_allow: [".qa/authz-matrix.yaml", ".qa/bugs/**", ".qa/reports/authz-**"]

  # --- Test authors: tests and their own reports; never source (P4) ---------
  unit-smith:
    write_allow: ["tests/**", "test/**", "**/*.test.*", "**/*.spec.*", "spec/**",
                  ".qa/reports/unit-smith-**", ".qa/disputes/**"]

  flow-smith:
    write_allow: ["tests/**", "e2e/**", "**/*.spec.ts", ".qa/plans/**",
                  ".qa/reports/flow-smith-**", ".qa/artifacts/**"]

  # --- Fixer: source only; explicitly NOT tests (P4) ------------------------
  # This is the single most important row. The dominant path to a meaningless
  # test is: agent writes test -> test fails -> same agent "fixes" it by
  # loosening the assertion. patch-smith cannot touch a test at all.
  patch-smith:
    write_allow: ["src/**", "lib/**", "app/**", "packages/*/src/**"]
    write_deny:
      - "tests/**"
      - "test/**"
      - "**/*.test.*"
      - "**/*.spec.*"
      - ".qa/reports/**"
    # P7: no retrieving the answer. No history mining, no upstream lookup.
    bash_deny:
      - '^\s*git\s+(log|show|blame|fetch|pull)'
      - '^\s*(curl|wget)\b'
    url_deny: ["github.com", "gitlab.com", "stackoverflow.com"]

  # --- Build cop ------------------------------------------------------------
  flake-warden:
    write_allow: [".qa/flakes.json", ".qa/reports/nightly-**", ".qa/quarantine.yaml"]

  # --- Marshal: reports only. No code, ever. --------------------------------
  release-marshal:
    write_allow: [".qa/reports/**", ".qa/metrics/verdicts/**"]
