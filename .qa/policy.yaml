# Separation-of-duties policy (spec §4 P4, enforced by G5).
#
# This file IS the P4 table. .claude/hooks/qa-guard.py reads it on every
# PreToolUse call and adjudicates by the calling agent's `agent_type`.
#
# Adopted 2026-08-10 from .qa/policy.proposed.yaml. It is #6's policy plus
# three fixes found by running the guard against the merged result:
#
#   1. read_deny matches by file EXTENSION, which is the better rule — but the
#      guard tests the Grep PATTERN as well as the resolved path, and a bare
#      directory glob has no extension. `Grep "index/**"` matched no *.py rule
#      and was allowed, so spec-oracle could read the implementation: the one
#      thing that agent exists not to do. Directory globs are restored
#      alongside the extension ones; the two fail open in different directions.
#
#   2. .qa/fixtures/** added to unit-smith. It holds the G3 self-test's input,
#      and the agent that owns test quality could not touch the fixtures that
#      prove the quality gate works.
#
#   3. write_deny_always is enforced on a tool's TARGET PATH, so it covers
#      Write and Edit but not Bash. Nothing stopped `echo x > .qa/policy.yaml`
#      or `sed -i ... .qa/gates/g2-mutation.sh`. The rules below target the
#      mutating verbs only — the previous version matched any command
#      MENTIONING those paths, which blocked `ls`, `grep`, and running a gate.
#
# Semantics:
#   write_allow  — globs this agent may create/modify. Empty means no writes.
#   read_deny    — patterns this agent may NOT read, via ANY content-returning
#                  tool (Read, Grep, Glob, WebFetch).
#   url_deny     — substrings that, if present in a WebFetch URL, are blocked.
#   bash_deny    — regexes matched against the full Bash command.
#
# An agent_type absent from this file is DENIED any write. Fail closed.
#
# NOT ENFORCED: `read_allow` and `agent_write_deny` are recorded below but
# qa-guard.py implements neither and ignores unrecognised keys silently. They
# document intent, nothing more. Making them real needs an edit to
# .claude/hooks/qa-guard.py.

defaults:
  # Snapshot laundering (P8/G4). Every pattern is anchored to a TEST RUNNER.
  bash_deny:
    - '\b(jest|vitest)\b[^|;]*\s(-u|--update|--updateSnapshot)(\s|$)'
    - '\bplaywright\b[^|;]*--update-snapshots'
    - '\bpytest\b[^|;]*--snapshot-update'
    - '\bcargo\s+insta\s+accept\b'
    - '\bava\b[^|;]*--update-snapshots'
    # FIX 3 — mutating the referee from a shell. Reading and EXECUTING stay
    # allowed; a gate you cannot run is not a gate.
    - '\b(tee|truncate|dd|shred)\b[^;&|]*\.qa/(policy\.yaml|gates/|RISK-RULES\.yaml)'
    - '\bsed\b[^;&|]*-i[^;&|]*\.qa/(policy\.yaml|gates/|RISK-RULES\.yaml)'
    - '\b(mv|cp|rm|ln)\b[^;&|]*\.qa/(policy\.yaml|gates/|RISK-RULES\.yaml)'
    - '>>?\s*\.qa/(policy\.yaml|gates/|RISK-RULES\.yaml)'
    - '\b(tee|sed|mv|cp|rm|ln|truncate)\b[^;&|]*\.claude/hooks/'
    - '>>?\s*\.claude/hooks/'

  write_deny_always:
    - ".qa/policy.yaml"
    - ".claude/hooks/**"

  # INERT — see the header. Kept so the intent survives.
  agent_write_deny:
    - ".qa/gates/**"
    - ".qa/RISK-RULES.yaml"
    - ".claude/qa-settings/**"
    - ".github/workflows/**"

agents:

  risk-scout:
    write_allow: [".qa/risk/**"]

  spec-oracle:
    write_allow: [".qa/oracles/**"]
    # INERT — the guard has no allow-list logic. Recorded, not enforced.
    read_allow:
      - "README*"
      - "docs/**"
      - "doc/**"
      - "**/*.md"
      - "openapi.*"
      - "swagger.*"
      - "**/*.graphql"
      - "**/schema.json"
      - ".qa/oracles/**"
      - ".qa/charters/**"
    read_deny:
      # By extension, so a new source folder cannot quietly escape the rule.
      - "**/*.py"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.sql"
      - "**/*.diff"
      - "**/*.patch"
      # FIX 1 — and by directory, so a bare glob in a Grep pattern cannot slip
      # past the extension rules.
      - "index/**"
      - "parser/**"
      - "scraper/**"
      - "ops/**"
      - "migrations/**"
      - "web/**"
      - "tests/**"
      - ".qa/risk/**"
    url_deny:
      - "/pull/"
      - "/commit/"
      - "/compare/"
      - ".diff"
      - ".patch"
      - "/blob/"
      - "/raw/"
    bash_deny:
      - '^\s*git\s+(diff|show|log|blame)'
      - '^\s*(cat|head|tail|sed|awk|less)\b'

  prober:
    write_allow: [".qa/sessions/**", ".qa/bugs/**", ".qa/charters/**", ".qa/artifacts/**"]

  authz-prober:
    write_allow: [".qa/authz-matrix.yaml", ".qa/bugs/**", ".qa/reports/authz-**"]

  unit-smith:
    # FIX 2 — .qa/fixtures/** added: it holds the G3 self-test's input.
    write_allow: ["tests/**", "**/*.test.*", "**/*.spec.*", ".qa/fixtures/**",
                  ".qa/reports/unit-smith-**", ".qa/disputes/**"]

  flow-smith:
    write_allow: ["tests/**", "e2e/**", "**/*.spec.ts", ".qa/plans/**",
                  ".qa/reports/flow-smith-**", ".qa/artifacts/**"]

  # The load-bearing row: the agent that fixes code may not edit the test that
  # judges the fix.
  patch-smith:
    write_allow: ["index/**", "parser/**", "scraper/**", "web/**",
                  "pipeline.py", "run_filter.py", "sold_tracer.py"]
    write_deny:
      - "tests/**"
      - "**/*.test.*"
      - "**/*.spec.*"
      - "**/conftest.py"
      - "migrations/**"        # applied migrations are not reversible by a deploy
      - ".qa/reports/**"
    bash_deny:
      - '^\s*git\s+(log|show|blame|fetch|pull)'
      - '^\s*(curl|wget)\b'
    url_deny: ["github.com", "gitlab.com", "stackoverflow.com"]

  flake-warden:
    write_allow: [".qa/flakes.json", ".qa/reports/nightly-**", ".qa/quarantine.yaml"]

  release-marshal:
    write_allow: [".qa/reports/**", ".qa/metrics/verdicts/**"]
