# Risk banding for sg-luxury-watch-index.
#
# Derived from the real repository layout. The kit ships placeholder globs
# pointing at src/billing and src/auth; this project has no src/ at all, so
# every rule missed and index_engine.py fell through to the medium default —
# the most important file in the repository getting the least scrutiny.
#
# FIRST MATCHING RULE WINS — order matters.
version: 1

rules:
  # This project's "money" is not payments — it is the published price index.
  # A wrong number here is the product being wrong.
  - if:
      paths: ["index/index_engine.py", "index/signals.py", "migrations/**"]
    band: critical
    why: "the price index itself, the signals derived from it, and irreversible schema change"

  - if:
      paths: ["index/**", "parser/dedupe.py", "parser/references.py"]
    band: high
    why: "export pipeline and reference grouping — errors here silently corrupt every downstream price"

  - if:
      paths: ["scraper/**", "parser/**", "sold_tracer.py", "pipeline.py"]
    band: high
    why: "ingestion; bad input propagates into the index and is hard to detect after the fact"

  - if:
      paths: ["web/**"]
      lines_changed: ">50"
    band: high
    why: "the public surface, and where the FE/BE contract can drift"

  - if:
      paths: ["**/*.md", "ops/**", "**/*.css"]
      only: true
    band: low
    why: "no production behaviour can change"

  - if:
      lines_changed: "<20"
      files_changed: "<3"
    band: medium

  - default: medium

escalators:
  - no_covering_test_for_changed_file
  - deletes_or_alters_a_db_migration
  - changes_a_public_api_signature
  - touches_a_file_with_open_S1_or_S2_bug

# Where G2 applies. Python only — web/ is TypeScript with no mutation tool
# configured here, so it is reported rather than gated.
mutation_paths:
  - "index/**/*.py"
  - "parser/**/*.py"
  - "scraper/**/*.py"
  - "*.py"
  - "!tests/**"
  - "!migrations/**"        # one-shot scripts; mutants are mostly equivalent

gates:
  # Ratcheted 0.60 -> 0.65 on 2026-08-10. index/index_engine.py measured 0.6842
  # once build_indices() had real coverage, so 0.60 no longer constrains
  # anything there. §5 G2: ratchet up, never down — a threshold the code
  # already clears is a gate in name only.
  mutation_threshold: 0.65
  mutation_wall_clock_seconds: 900
  oracle_min_propositions:
    critical: 8
    high: 5
    medium: 3
    low: 0
  oracle_citation_rate_floor: 0.70
  pr_budget_usd: 8.00
  pr_budget_usd_by_band:
    low: 1.00
    medium: 8.00
    high: 25.00
    critical: 50.00

# §15 Q20, answered by the owner: "no bugs, no inaccuracies, no faulty logic,
# no faulty math, no contradictions." A pure correctness definition, which suits
# a numerical index unusually well.
confidence_criteria:
  - id: C1
    name: faulty_math
    evidence: mutation score against arithmetic and boundary mutators; median and
      baseline behaviour in index_engine; outlier thresholds; SGD integer edges
      (zero, negative, and absurd highs like the existing 500 against a 16200 baseline)
  - id: C2
    name: faulty_logic
    evidence: mutation score against conditional and branch mutators, especially
      MIN_PER_BRAND gating and the outlier flag conditions
  - id: C3
    name: contradictions
    evidence: metamorphic relations — median is order-invariant, fill_series
      preserves length, dedupe is idempotent, reference grouping is stable
  - id: C4
    name: inaccuracies
    evidence: oracle propositions citing METHODOLOGY.md and ARCHITECTURE.md;
      citation rate
  - id: C5
    name: bugs_generally
    evidence: G1 fails-before/passes-after; the suite actually running in CI;
      the 44 skipped tests named explicitly rather than counted as passes

# §15 Q17, answered: fast rollback, no feature flags or staged rollout.
ship_with_watch_available: true

rollback:
  mechanism: redeploy_previous_version
  typical_minutes: 5          # a guess — time a real rollback and correct it
  granularity: whole_deploy
  rollback_unsafe_paths:
    # Root-anchored AND nested. Fitting the globs to this repo's layout
    # narrowed "**/migrations/**" to "migrations/**", which silently stopped
    # matching db/migrations/, web/migrations/ or anything else nested — G7
    # would have allowed SHIP_WITH_WATCH on an applied migration living one
    # directory deeper. This is the gate you want over-inclusive: a false
    # refusal costs a conversation, a false allow costs a database.
    - "migrations/**"
    - "**/migrations/**"
    - "**/migrate/**"
    - "**/*_migration.*"
    - "**/backfill*"
    # A published index figure that readers have already seen cannot be
    # un-published by redeploying yesterday's code.
    - "index/export_pipeline.py"
    - "index/export_sheets.py"
  rollback_unsafe_reasons:
    schema: "an applied migration is not reverted by redeploying old code"
    published: "an index figure already exported to Sheets or the site has been read; a rollback does not unsend it"

routing:
  low:      [risk-scout]
  medium:   [risk-scout, spec-oracle, unit-smith, release-marshal]
  high:     [risk-scout, spec-oracle, unit-smith, release-marshal]
  critical: [risk-scout, spec-oracle, unit-smith, prober, release-marshal]
  # flow-smith and authz-prober are omitted deliberately: there is no browser
  # e2e harness here and no multi-user auth surface for an authz matrix to
  # cover. Add them when those exist rather than routing to agents that would
  # have nothing to do.
