# PROPOSED separation-of-duties policy — .qa/policy.yaml plus three fixes.
#
# `.qa/policy.yaml` is the ONLY file still immutable from inside a session
# (write_deny_always), and that is correct: an agent must not edit the referee
# mid-game. So this sits alongside it. To adopt:
#
#     mv .qa/policy.proposed.yaml .qa/policy.yaml
#
# This is #6's policy verbatim except for the three items below. #6 was the
# bigger and better change — extension-based read rules beat directory-based
# ones, and fitting the write globs to this repo un-bricked patch-smith. These
# are gaps found by running the guard against the merged result, not a
# competing design.
#
# ---- FIX 1: a Grep with a directory glob walks straight past read_deny ------
#
# #6 matches read_deny by file EXTENSION so "a new source folder cannot quietly
# escape the rule". True, but the guard tests the Grep *pattern* as well as the
# resolved path, and a bare directory glob has no extension:
#
#     Grep pattern "index/**"   -> matches no *.py rule -> ALLOWED
#
# spec-oracle could read the implementation that way, which is the single thing
# it exists not to do. Directory globs are restored ALONGSIDE the extension
# ones — belt and braces, since the two fail open in different directions.
#
# ---- FIX 2: unit-smith cannot maintain the vacuity fixtures ----------------
#
# .qa/fixtures/ now holds the G3 self-test's input. It is not in unit-smith's
# write_allow, so the agent that owns test quality cannot touch the fixtures
# that prove the quality gate works.
#
# ---- FIX 3: nothing stops a shell write to the referee ---------------------
#
# write_deny_always is enforced on a tool's TARGET PATH, which covers Write and
# Edit but not Bash. With the old text-matching bash rule gone there is no
# check at all on:
#
#     echo x > .qa/policy.yaml
#     sed -i s/0.60/0.10/ .qa/gates/g2-mutation.sh
#
# The old rule was far too broad — it matched any command *mentioning* those
# paths, so `ls .qa/gates/` and even running a gate were blocked. Narrowing it
# to the mutating verbs keeps the protection and drops the false positives.
#
# ---- NOT FIXED HERE: two keys the guard does not implement -----------------
#
# `read_allow` and `agent_write_deny` were introduced by #6 and are both INERT:
# .claude/hooks/qa-guard.py reads only `defaults.write_deny_always`,
# `bash_deny`, `read_deny`, `url_deny`, `write_allow` and `write_deny`, and it
# ignores unrecognised keys silently. They are kept below so the intent stays
# recorded, but they enforce nothing today. Making them real needs an edit to
# qa-guard.py, which is under .claude/hooks/** and immutable from a session.

defaults:
  # Snapshot laundering (P8/G4). Every pattern is anchored to a TEST RUNNER.
  bash_deny:
    - '\b(jest|vitest)\b[^|;]*\s(-u|--update|--updateSnapshot)(\s|$)'
    - '\bplaywright\b[^|;]*--update-snapshots'
    - '\bpytest\b[^|;]*--snapshot-update'
    - '\bcargo\s+insta\s+accept\b'
    - '\bava\b[^|;]*--update-snapshots'
    # FIX 3 — mutating the referee from a shell. Reading and EXECUTING stay
    # allowed; a gate you cannot run is not a gate.
    - '\b(tee|truncate|dd|shred)\b[^;&|]*\.qa/(policy\.yaml|gates/|RISK-RULES\.yaml)'
    - '\bsed\b[^;&|]*-i[^;&|]*\.qa/(policy\.yaml|gates/|RISK-RULES\.yaml)'
    - '\b(mv|cp|rm|ln)\b[^;&|]*\.qa/(policy\.yaml|gates/|RISK-RULES\.yaml)'
    - '>>?\s*\.qa/(policy\.yaml|gates/|RISK-RULES\.yaml)'
    - '\b(tee|sed|mv|cp|rm|ln|truncate)\b[^;&|]*\.claude/hooks/'
    - '>>?\s*\.claude/hooks/'

  write_deny_always:
    - ".qa/policy.yaml"
    - ".claude/hooks/**"

  # INERT — see the header. Kept so the intent survives.
  agent_write_deny:
    - ".qa/gates/**"
    - ".qa/RISK-RULES.yaml"
    - ".claude/qa-settings/**"
    - ".github/workflows/**"

agents:

  risk-scout:
    write_allow: [".qa/risk/**"]

  spec-oracle:
    write_allow: [".qa/oracles/**"]
    # INERT — the guard has no allow-list logic. Recorded, not enforced.
    read_allow:
      - "README*"
      - "docs/**"
      - "doc/**"
      - "**/*.md"
      - "openapi.*"
      - "swagger.*"
      - "**/*.graphql"
      - "**/schema.json"
      - ".qa/oracles/**"
      - ".qa/charters/**"
    read_deny:
      # By extension, so a new source folder cannot quietly escape the rule.
      - "**/*.py"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.sql"
      - "**/*.diff"
      - "**/*.patch"
      # FIX 1 — and by directory, so a bare glob in a Grep pattern cannot slip
      # past the extension rules.
      - "index/**"
      - "parser/**"
      - "scraper/**"
      - "ops/**"
      - "migrations/**"
      - "web/**"
      - "tests/**"
      - ".qa/risk/**"
    url_deny:
      - "/pull/"
      - "/commit/"
      - "/compare/"
      - ".diff"
      - ".patch"
      - "/blob/"
      - "/raw/"
    bash_deny:
      - '^\s*git\s+(diff|show|log|blame)'
      - '^\s*(cat|head|tail|sed|awk|less)\b'

  prober:
    write_allow: [".qa/sessions/**", ".qa/bugs/**", ".qa/charters/**", ".qa/artifacts/**"]

  authz-prober:
    write_allow: [".qa/authz-matrix.yaml", ".qa/bugs/**", ".qa/reports/authz-**"]

  unit-smith:
    # FIX 2 — .qa/fixtures/** added: it holds the G3 self-test's input.
    write_allow: ["tests/**", "**/*.test.*", "**/*.spec.*", ".qa/fixtures/**",
                  ".qa/reports/unit-smith-**", ".qa/disputes/**"]

  flow-smith:
    write_allow: ["tests/**", "e2e/**", "**/*.spec.ts", ".qa/plans/**",
                  ".qa/reports/flow-smith-**", ".qa/artifacts/**"]

  # The load-bearing row: the agent that fixes code may not edit the test that
  # judges the fix.
  patch-smith:
    write_allow: ["index/**", "parser/**", "scraper/**", "web/**",
                  "pipeline.py", "run_filter.py", "sold_tracer.py"]
    write_deny:
      - "tests/**"
      - "**/*.test.*"
      - "**/*.spec.*"
      - "**/conftest.py"
      - "migrations/**"        # applied migrations are not reversible by a deploy
      - ".qa/reports/**"
    bash_deny:
      - '^\s*git\s+(log|show|blame|fetch|pull)'
      - '^\s*(curl|wget)\b'
    url_deny: ["github.com", "gitlab.com", "stackoverflow.com"]

  flake-warden:
    write_allow: [".qa/flakes.json", ".qa/reports/nightly-**", ".qa/quarantine.yaml"]

  release-marshal:
    write_allow: [".qa/reports/**", ".qa/metrics/verdicts/**"]
