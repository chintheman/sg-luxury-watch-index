name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Previously this was `pip install pytest` alone, so requests and bs4 were
      # missing, scraper/scraper.py failed to import, and the run died at
      # collection with exit code 2. Every run on main has been red — the suite
      # has never actually executed in CI.
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -v
